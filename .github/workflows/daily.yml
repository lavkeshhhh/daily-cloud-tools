name: Publish daily tool
on:
  schedule:
    # 09:17 in Asia/Kolkata
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: daily-cloud-tools-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
      - name: Verify the input repository and privacy rules
        run: |
          python3 -B scripts/privacy.py --history HEAD
          python3 -B -m unittest discover -s test -p 'privacy_test.py'
          node --test test/*.test.cjs
      - name: Build today's application
        id: build
        run: node -e 'const {publish}=require("./scripts/publish.cjs"); console.log("slug="+publish().slug)' >> "$GITHUB_OUTPUT"
      - name: Check the generated program and stage approved files
        env:
          APP_SLUG: ${{ steps.build.outputs.slug }}
        run: |
          node scripts/verify.cjs
          git add -- "site/apps/$APP_SLUG" site/index.html
          python3 -B scripts/privacy.py --daily HEAD "$APP_SLUG"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Publish $APP_SLUG"
          fi
      - name: Scan the working tree and final commit history
        run: |
          python3 -B scripts/privacy.py --history HEAD
          bash scripts/secret-scan.sh
      - name: Publish the checked commit
        run: git push origin HEAD:main
      - name: Package the checked site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy the collection
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
